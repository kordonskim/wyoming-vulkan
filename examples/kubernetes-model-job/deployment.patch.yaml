# Kustomize strategic merge patch; adjust metadata.name to your existing Deployment name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-vulkan
spec:
  template:
    spec:
      initContainers:
        # Remove the existing network-dependent preparation step.
        - name: fetch-models
          $patch: delete
        # Check files without installing packages, cloning Git, or downloading models.
        - name: check-models
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for model in \
                parakeet/ggml-parakeet-tdt-0.6b-v3-q8_0.bin \
                whisper/ggml-medium-q5_0.bin \
                whisper/ggml-large-v3-turbo-q5_0.bin \
                whisper/ggml-large-v3-q5_0.bin; do
                if [ ! -s "/data/models/$model" ]; then
                  echo "Missing or empty model: $model. Run the model-download Job first." >&2
                  exit 1
                fi
              done
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
