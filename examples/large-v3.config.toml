# Append to the existing config.toml. Keep its [server], [gpu], [hass] and other engines/endpoints.
# Download with: scripts/fetch-models.sh -d /data/models whisper-large-v3-q5_0
[[stt]]
name = "whisper-large-v3"
backend = "whisper.cpp"
