name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment model-download entry point
        run: |
          bash -n scripts/fetch-models.sh
          bash scripts/fetch-models.sh --list > "$RUNNER_TEMP/wyoming-models.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          names = {line.split()[0] for line in Path(os.environ["RUNNER_TEMP"], "wyoming-models.txt").read_text().splitlines() if line.strip()}
          assert {"parakeet-q8_0", "whisper-medium-q5_0", "whisper-large-v3-turbo-q5_0"} <= names
          PY

      - name: Download upstream and apply HA patches
        run: python3 scripts/prepare-source.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .build/upstream
          load: true
          tags: wyoming-vulkan:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render deployment config
        working-directory: .build/upstream
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["configs"]["wyoming_vulkan_config"]["content"], end="")' > "$RUNNER_TEMP/wyoming-config.toml"

      - name: Unit and Wyoming protocol tests (no GPU or models required)
        working-directory: .build/upstream
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/tests:/tests:ro" \
            -v "$RUNNER_TEMP/wyoming-config.toml:/deploy/config.toml:ro" \
            wyoming-vulkan:ci -m unittest discover -s /tests -p 'test_*.py'

      - name: Native binding ABI checks
        working-directory: .build/upstream
        env:
          IMAGE: wyoming-vulkan:ci
        run: bash tests/check_abi.sh
