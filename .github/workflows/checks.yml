name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wyoming-vulkan:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render deployment config
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["configs"]["wyoming_vulkan_config"]["content"], end="")' > "$RUNNER_TEMP/wyoming-config.toml"

      - name: Unit and Wyoming protocol tests (no GPU or models required)
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/tests:/tests:ro" \
            -v "$RUNNER_TEMP/wyoming-config.toml:/deploy/config.toml:ro" \
            wyoming-vulkan:ci -m unittest discover -s /tests -p 'test_*.py'

      - name: Native binding ABI checks
        env:
          IMAGE: wyoming-vulkan:ci
        run: bash tests/check_abi.sh
