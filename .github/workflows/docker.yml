
name: Build Wyoming Vulkan

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, e.g. v0.1.1 (must not already exist)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-image-release
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the requested release
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Enter a version such as v0.1.1 or v0.2.0.' >&2
            exit 1
          fi
          existing=$(git ls-remote --tags origin "refs/tags/$VERSION")
          if [[ -n "$existing" ]]; then
            echo 'That release tag already exists. Choose a new version.' >&2
            exit 1
          fi

  checks:
    needs: validate-version
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream and apply HA patches
        id: source
        run: |
          python3 scripts/prepare-source.py
          echo "revision=$(git -C .build/upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .build/upstream
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.github.kordonskim.upstream.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create matching Git release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$GITHUB_SHA" -m "Wyoming Vulkan HA $VERSION"
          git push origin "refs/tags/$VERSION"
          echo "Published ghcr.io/${GITHUB_REPOSITORY}:$VERSION and latest; created Git tag $VERSION." >> "$GITHUB_STEP_SUMMARY"
